name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Build
        env:
          ASTRO_BASE: "/architect-lp/"
        run: npm run build

      - name: Disable Jekyll on GitHub Pages
        # Create a .nojekyll file in the publish directory so GitHub Pages won't run Jekyll
        run: |
          echo "" > ./dist/.nojekyll

      - name: Show dist contents
        run: |
          echo "-- dist contents --"
          ls -la ./dist || true
          echo "-- end dist contents --"

      - name: Show .nojekyll and preview index
        run: |
          echo "Checking for .nojekyll..."
          if [ -f ./dist/.nojekyll ]; then echo ".nojekyll exists"; else echo ".nojekyll missing"; fi
          echo "---- show .nojekyll ----"
          cat ./dist/.nojekyll || true
          echo "---- index.html preview ----"
          head -n 40 ./dist/index.html || true

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # If your repo is a project page (not user/org), set publish_branch: gh-pages
